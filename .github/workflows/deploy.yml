name: Pergamon CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Node.js deprecation uyarısını çözmek için ortam değişkeni
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Projeyi derliyoruz (target klasörü burada oluşuyor)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Çift .jar oluşup Dockerfile'ı patlatmasın diye .original olanı siliyoruz
      - name: Clean Extra Jar Files
        run: rm -f target/*.original

      # Docker Hub Girişi
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # İmajı Oluştur ve Gönder
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
          # Hatanın çözümü: Dockerfile içindeki JAR_FILE argümanına yolu açıkça veriyoruz
          build-args: |
            JAR_FILE=target/*.jar

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker stop pergamon-api || true
            docker rm pergamon-api || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
            
            docker run -d \
              --name pergamon-api \
              -p 8000:8000 \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
