name: Pergamon Backend CD (Docker Over Cloudflare)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      # GitHub Actions'a komutları hangi sunucuya göndereceğini söylüyoruz
      DOCKER_HOST: "tcp://docker-api.senindomainin.com:443" 
    steps:
      - name: Deploy to Remote Docker via Cloudflare Tunnel
        run: |
          echo "Connecting to remote Docker Daemon via Cloudflare..."
          
          
          docker stop pergamon-api || true
          docker rm pergamon-api || true
          
          
          docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest || true
          
          
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
          
          
          docker run -d \
            --name pergamon-api \
            -p 8000:8000 \
            --restart always \
            ${{ secrets.DOCKERHUB_USERNAME }}/pergamon-backend:latest
